# ============================================================================
# CI Workflow - Build, Test, Lint
# ============================================================================
# MODULE_CONTRACT: MC-ci-github-actions
# Triggers on every push and pull request to ensure code quality.
#
# Jobs:
#   - build: Compile and verify the project
#   - test: Run unit, integration, architecture, and contract tests
#   - lint: Check code style and formatting
#
# Links:
#   - DevelopmentPlan.xml#DP-INFRA-ci-cd
#   - Technology.xml#TECH-CICD-001
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Job
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, Linux, X64, wsl]
    defaults:
      run:
        working-directory: backend/windows-store-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Compile project
        run: mvn -B -DskipTests compile

      - name: Verify project (skip tests)
        run: mvn -B -DskipTests verify

      - name: List built JAR artifacts
        run: |
          find . -type f -path "*/target/*.jar" ! -name "*-sources.jar" | sort

      - name: Upload config-server build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-config-server
          path: |
            backend/windows-store-server/config-server/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload gateway build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-gateway
          path: |
            backend/windows-store-server/gateway/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload shared build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-shared
          path: |
            backend/windows-store-server/shared/*/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload account-service build artifact
        id: upload_account_service
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-account-service
          path: |
            backend/windows-store-server/services/account-service/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload cart-service build artifact
        id: upload_cart_service
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-cart-service
          path: |
            backend/windows-store-server/services/cart-service/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload catalog-configuration-service build artifact
        id: upload_catalog_configuration_service
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-catalog-configuration-service
          path: |
            backend/windows-store-server/services/catalog-configuration-service/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload pricing-service build artifact
        id: upload_pricing_service
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-pricing-service
          path: |
            backend/windows-store-server/services/pricing-service/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload search-service build artifact
        id: upload_search_service
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-search-service
          path: |
            backend/windows-store-server/services/search-service/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload e2e build artifact
        id: upload_e2e
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-e2e-tests
          path: |
            backend/windows-store-server/e2e-tests/target/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Warn about optional artifact upload failures
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [[ "${{ steps.upload_account_service.outcome }}" == "failure" || "${{ steps.upload_cart_service.outcome }}" == "failure" || "${{ steps.upload_catalog_configuration_service.outcome }}" == "failure" || "${{ steps.upload_pricing_service.outcome }}" == "failure" || "${{ steps.upload_search_service.outcome }}" == "failure" || "${{ steps.upload_e2e.outcome }}" == "failure" ]]; then
            echo "::warning::One or more optional service/e2e artifact uploads failed. Build/test/lint quality checks still completed."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Job
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, wsl]
    needs: build
    defaults:
      run:
        working-directory: backend/windows-store-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run unit tests
        run: mvn -B -DfailIfNoTests=false test

      - name: Run integration tests
        run: mvn -B -DfailIfNoTests=false test-compile failsafe:integration-test failsafe:verify

      - name: Run ArchUnit tests
        run: mvn -B "-Dtest=ArchitectureTest" "-Dsurefire.failIfNoSpecifiedTests=false" "-DfailIfNoTests=false" test

      - name: Run contract tests
        run: mvn -B "-Dtest=*Contract*" "-Dsurefire.failIfNoSpecifiedTests=false" "-DfailIfNoTests=false" test

      - name: Generate test report
        if: always()
        run: mvn -B surefire-report:report-only

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: test-results
          path: |
            backend/windows-store-server/**/target/surefire-reports/
            backend/windows-store-server/**/target/failsafe-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint Job
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64, wsl]
    defaults:
      run:
        working-directory: backend/windows-store-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Check code formatting (Checkstyle)
        run: mvn -B checkstyle:check

      - name: Check for common bugs (SpotBugs)
        run: mvn -B -pl shared/shared-kernel,shared/test-support -am -DskipTests compile com.github.spotbugs:spotbugs-maven-plugin:4.9.8.1:check

      - name: Validate POM files
        run: mvn -B validate

      - name: Validate Flyway migrations per DB service
        run: |
          set -euo pipefail
          services=(
            "account-service"
            "cart-service"
            "catalog-configuration-service"
            "pricing-service"
          )
          for service in "${services[@]}"; do
            migration_dir="services/${service}/src/main/resources/db/migration"
            if [[ ! -d "${migration_dir}" ]]; then
              echo "::error::Missing Flyway migration directory: ${migration_dir}"
              exit 1
            fi
            migration_count=$(find "${migration_dir}" -maxdepth 1 -type f -name 'V*.sql' | wc -l)
            if [[ "${migration_count}" -lt 1 ]]; then
              echo "::error::No Flyway migrations found in: ${migration_dir}"
              exit 1
            fi
          done

      - name: Check dependency convergence
        run: mvn -B dependency:analyze-only

  # ─────────────────────────────────────────────────────────────────────────────
  # Coverage Job
  # ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: [self-hosted, Linux, X64, wsl]
    needs: test
    defaults:
      run:
        working-directory: backend/windows-store-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Generate coverage report (JaCoCo)
        run: mvn -B jacoco:report
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: coverage-report
          path: backend/windows-store-server/**/target/site/jacoco/
          retention-days: 7
